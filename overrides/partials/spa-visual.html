<!-- Animated SPA story: probes bounce off the gateway, one SPA packet passes,
     the gate opens and the hidden service appears. Pure CSS; static final
     state when the user prefers reduced motion. -->
<svg class="spa" viewBox="0 0 560 340" role="img" aria-labelledby="spa-title spa-desc">
  <title id="spa-title">Single Packet Authorization</title>
  <desc id="spa-desc">Connection attempts are dropped by the gateway. A single authenticated packet opens a path from the client to the hidden service.</desc>
  <defs>
    <pattern id="spa-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" class="spa__gridline"/>
    </pattern>
    <radialGradient id="spa-glow">
      <stop offset="0" class="spa__glow-in"/>
      <stop offset="1" class="spa__glow-out"/>
    </radialGradient>
  </defs>

  <rect width="560" height="340" rx="18" class="spa__panel"/>
  <rect width="560" height="340" rx="18" fill="url(#spa-grid)"/>

  <!-- protected zone -->
  <rect x="330" y="34" width="208" height="272" rx="14" class="spa__zone"/>
  <text x="434" y="58" class="spa__label spa__label--zone" text-anchor="middle">PRIVATE NETWORK</text>

  <!-- data path that appears after authorization -->
  <path d="M118 170 H 434" class="spa__path"/>

  <!-- probes that get dropped -->
  <g class="spa__probes">
    <circle r="5" class="spa__probe spa__probe--1" cx="118" cy="128"/>
    <circle r="5" class="spa__probe spa__probe--2" cx="118" cy="212"/>
    <circle r="5" class="spa__probe spa__probe--3" cx="118" cy="170"/>
  </g>

  <!-- client -->
  <g class="spa__node spa__node--client">
    <rect x="58" y="138" width="64" height="64" rx="14"/>
    <path d="M78 160h24M78 170h24M78 180h14" class="spa__glyph"/>
  </g>
  <text x="90" y="230" class="spa__label" text-anchor="middle">CLIENT</text>

  <!-- gateway -->
  <g class="spa__gate">
    <rect x="260" y="92" width="22" height="78" rx="6" class="spa__gate-top"/>
    <rect x="260" y="170" width="22" height="78" rx="6" class="spa__gate-bottom"/>
    <circle cx="271" cy="170" r="34" fill="url(#spa-glow)" class="spa__gate-glow"/>
  </g>
  <text x="271" y="276" class="spa__label" text-anchor="middle">GATEWAY</text>

  <!-- the single packet -->
  <g class="spa__packet">
    <circle cx="118" cy="170" r="7"/>
    <circle cx="118" cy="170" r="14" class="spa__packet-halo"/>
  </g>

  <!-- hidden service -->
  <g class="spa__node spa__node--service">
    <rect x="402" y="138" width="64" height="64" rx="14"/>
    <path d="M420 158h28M420 170h28M420 182h28" class="spa__glyph"/>
  </g>
  <text x="434" y="230" class="spa__label spa__label--service" text-anchor="middle">SERVICE</text>

  <!-- status line -->
  <text x="40" y="312" class="spa__status spa__status--denied">DROP  tcp/8080  no rule</text>
  <text x="40" y="312" class="spa__status spa__status--granted">ACCEPT  10.231.0.40 → :8080  30 s</text>
</svg>
