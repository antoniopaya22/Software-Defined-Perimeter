version: 2
updates:
  # Base images of the controller, gateway and client
  - package-ecosystem: docker
    directories:
      - /controller
      - /gateway
      - /client
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  # mariadb, nginx and phpmyadmin images in docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
