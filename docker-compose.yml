# Software-Defined Perimeter lab
#
#   sdp-public  : client, gateway, controller (untrusted side)
#   sdp-private : gateway, protected-service (only reachable through the gateway)
#   sdp-mgmt    : controller <-> database (internal, no host access)
#
# Usage:  cp .env.example .env  # then set real passwords
#         docker compose up -d --build
#         ./scripts/demo.sh

name: sdp

x-defaults: &defaults
  restart: unless-stopped
  init: true

services:

  # ============== SDP DATABASE ==============
  sdp-db:
    <<: *defaults
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: sdp
      MARIADB_USER: ${DB_USER:-sdp}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PROTECTED_SERVICE_IP: ${PROTECTED_SERVICE_IP:-10.231.1.30}
      PROTECTED_PORT: ${PROTECTED_PORT:-8080}
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    networks:
      - sdp-mgmt
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ============== SDP CONTROLLER ==============
  sdp-controller:
    <<: *defaults
    build: ./controller
    environment:
      DB_HOST: sdp-db
      DB_USER: ${DB_USER:-sdp}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: sdp
      CA_KEY_PASSWORD: ${CA_KEY_PASSWORD:?set CA_KEY_PASSWORD in .env}
      SDP_IDS: "1 2 3"
      CONTROLLER_SDP_ID: "2"
    volumes:
      - pki:/certs
      - bundles:/bundles
    networks:
      sdp-mgmt:
      sdp-public:
        ipv4_address: ${CONTROLLER_IP:-10.231.0.10}
    depends_on:
      sdp-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/certs/.ready"]
      interval: 3s
      timeout: 3s
      retries: 60

  # ============== SDP GATEWAY ==============
  sdp-gateway:
    <<: *defaults
    build: ./gateway
    cap_add:
      - NET_ADMIN   # iptables
      - NET_RAW     # libpcap sniffing of SPA packets
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      SDP_ID: "1"
      PUBLIC_IP: ${GATEWAY_IP:-10.231.0.20}
      CTRL_ADDR: sdp-controller
    volumes:
      - type: volume
        source: bundles
        target: /bundle
        read_only: true
        volume:
          subpath: "1"
      # credentials rotated by the controller survive container re-creation
      - gateway-state:/etc/fwknop
    networks:
      sdp-public:
        ipv4_address: ${GATEWAY_IP:-10.231.0.20}
      sdp-private:
        ipv4_address: ${GATEWAY_PRIVATE_IP:-10.231.1.20}
    depends_on:
      sdp-controller:
        condition: service_healthy

  # ============== PROTECTED SERVICE (Accepting Host) ==============
  protected-service:
    <<: *defaults
    image: nginx:1.31-alpine
    networks:
      sdp-private:
        ipv4_address: ${PROTECTED_SERVICE_IP:-10.231.1.30}

  # ============== SDP CLIENT (Initiating Host) ==============
  sdp-client:
    <<: *defaults
    build: ./client
    environment:
      SDP_ID: "3"
      GATEWAY_IP: ${GATEWAY_IP:-10.231.0.20}
      SERVICE_IDS: "1"
      CTRL_ADDR: sdp-controller
    volumes:
      - type: volume
        source: bundles
        target: /bundle
        read_only: true
        volume:
          subpath: "3"
      # ~/.fwknoprc and keys are rotated by the controller on every session
      - client-home:/root
    networks:
      sdp-public:
        ipv4_address: ${CLIENT_IP:-10.231.0.40}
    depends_on:
      sdp-controller:
        condition: service_healthy
      sdp-gateway:
        condition: service_started

  # ============== OPTIONAL: phpMyAdmin (docker compose --profile debug up) ==============
  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: ["debug"]
    environment:
      PMA_HOST: sdp-db
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - sdp-mgmt
    depends_on:
      sdp-db:
        condition: service_healthy

networks:
  sdp-public:
    ipam:
      config:
        - subnet: ${PUBLIC_SUBNET:-10.231.0.0/24}
  sdp-private:
    internal: true
    ipam:
      config:
        - subnet: ${PRIVATE_SUBNET:-10.231.1.0/24}
  sdp-mgmt:
    internal: true

volumes:
  db-data:
  pki:
  bundles:
  gateway-state:
  client-home:
